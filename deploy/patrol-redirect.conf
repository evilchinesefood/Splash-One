# Keep bookmarks and previously embedded launcher icons working after the rename.
RedirectMatch 301 "^/patrol/patrol\.png$" "/splash-one/assets/icons/splash-one.png"
RedirectMatch 301 "^/patrol/(favicon|apple-touch-icon)\.png$" "/splash-one/assets/icons/$1.png"
RedirectMatch 301 "^/patrol(?:/.*)?$" "/splash-one/"
